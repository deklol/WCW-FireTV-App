plugins { id 'com.android.application' }
android {
    namespace 'uk.local.wcwvault'
    compileSdk 35
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/sourceConfigAssets')
    // Sideloaded Fire OS 6+ APK; Google Play's target policy does not apply.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'uk.local.wcwvault'
        minSdk 25
        targetSdk 28
        versionCode 10
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (System.getenv('WCW_KEYSTORE')) {
                storeFile file(System.getenv('WCW_KEYSTORE'))
                storePassword System.getenv('WCW_STORE_PASSWORD')
                keyAlias System.getenv('WCW_KEY_ALIAS')
                keyPassword System.getenv('WCW_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; if (System.getenv('WCW_KEYSTORE')) signingConfig signingConfigs.release }
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**']
        resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}
tasks.register('prepareSourceConfig', Copy) {
    from rootProject.file('sources.json')
    into layout.buildDirectory.dir('generated/sourceConfigAssets')
}
tasks.named('preBuild').configure { dependsOn 'prepareSourceConfig' }
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
